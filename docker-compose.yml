x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: railradar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: railradar
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U railradar"]
      interval: 5s
      timeout: 3s
      retries: 15

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    logging: *logging
    environment:
      TRAFIKVERKET_API_KEY: ${TRAFIKVERKET_API_KEY:?}
      DATABASE_URL: postgres://railradar:${POSTGRES_PASSWORD:?}@postgres:5432/railradar
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    build:
      context: .
      target: caddy
    restart: unless-stopped
    logging: *logging
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-api.railradar.se}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  caddy_data:
  caddy_config:
