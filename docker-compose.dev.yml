services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: railradar
      POSTGRES_PASSWORD: railradar
      POSTGRES_DB: railradar
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U railradar"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
